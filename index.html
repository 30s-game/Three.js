<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Web FPS - Weapon System</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; border: 2px solid lime;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #ui {
            position: absolute; bottom: 30px; right: 50px;
            color: white; font-family: 'Courier New', Courier, monospace;
            text-align: right; text-shadow: 2px 2px 2px black;
        }
        .ammo { font-size: 40px; font-weight: bold; }
        .total-ammo { font-size: 20px; color: #aaa; }
        #weapon-name { font-size: 24px; margin-bottom: 5px; color: #ffcc00; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">
        <div id="weapon-name">돌격소총</div>
        <span class="ammo" id="current-ammo">30</span>
        <span class="total-ammo" id="max-ammo"> / 90</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 초기 세팅 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        document.addEventListener('click', () => controls.lock());

        // --- 조명 ---
        const light = new THREE.PointLight(0xffffff, 100);
        camera.add(light); // 카메라에 조명을 달아 무기가 잘 보이게 함
        scene.add(camera);

        // --- 무기 데이터 설정 ---
        const weapons = {
            "돌격소총": { ammo: 30, max: 30, total: 90, color: 0x444444, size: [0.2, 0.2, 0.8] },
            "쇼티": { ammo: 2, max: 2, total: 12, color: 0x222222, size: [0.15, 0.25, 0.5] },
            "단검": { ammo: 0, max: 0, total: 0, color: 0xcccccc, size: [0.05, 0.1, 0.4] }
        };
        let currentWpName = "돌격소총";
        let isReloading = false;

        // --- 무기 모델(Viewmodel) 생성 ---
        const weaponGroup = new THREE.Group();
        const weaponMesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.2, 0.2, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x444444 })
        );
        // 왼쪽 아래 배치
        weaponMesh.position.set(0.5, -0.4, -0.8); 
        weaponGroup.add(weaponMesh);
        camera.add(weaponGroup); // 카메라의 자식으로 설정하여 시선 이동을 따름

        // --- 재장전 로직 (수학적 계산) ---
        function reload() {
            const wp = weapons[currentWpName];
            if (isReloading || wp.ammo === wp.max || wp.total <= 0 || currentWpName === "단검") return;

            isReloading = true;
            console.log("재장전 중...");

            setTimeout(() => {
                const needed = wp.max - wp.ammo; // 탄창에 채울 양
                const transfer = Math.min(needed, wp.total); // 남은 총알과 필요한 양 중 작은 값
                
                wp.ammo += transfer;
                wp.total -= transfer;
                
                isReloading = false;
                updateUI();
            }, 1000); // 1초 뒤 장전 완료
        }

        // --- 발사 로직 ---
        function shoot() {
            const wp = weapons[currentWpName];
            if (isReloading) return;

            if (currentWpName !== "단검") {
                if (wp.ammo > 0) {
                    wp.ammo--;
                    recoilAnimation();
                } else {
                    reload();
                    return;
                }
            } else {
                recoilAnimation(); // 단검은 탄약 무관 휘두르기
            }
            updateUI();
        }

        // --- 반동/휘두르기 애니메이션 ---
        function recoilAnimation() {
            weaponMesh.position.z += 0.2; // 뒤로 밀림
            weaponMesh.rotation.y += 0.2; // 좌우 흔들림
            setTimeout(() => {
                weaponMesh.position.z = -0.8;
                weaponMesh.rotation.y = 0;
            }, 50);
        }

        // --- 무기 교체 ---
        function switchWeapon(id) {
            const names = ["돌격소총", "쇼티", "단검"];
            currentWpName = names[id - 1];
            const wp = weapons[currentWpName];
            
            // 모델 외형 변경
            weaponMesh.geometry = new THREE.BoxGeometry(...wp.size);
            weaponMesh.material.color.setHex(wp.color);
            
            updateUI();
        }

        function updateUI() {
            const wp = weapons[currentWpName];
            document.getElementById('weapon-name').innerText = currentWpName;
            document.getElementById('current-ammo').innerText = currentWpName === "단검" ? "-" : wp.ammo;
            document.getElementById('max-ammo').innerText = currentWpName === "단검" ? "" : ` / ${wp.total}`;
        }

        // --- 이벤트 리스너 ---
        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) shoot();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyR') reload();
            if (e.code === 'Digit1') switchWeapon(1);
            if (e.code === 'Digit2') switchWeapon(2);
            if (e.code === 'Digit3') switchWeapon(3);
        });

        // --- 애니메이션 루프 (흔들림 효과 추가) ---
        let walkCycle = 0;
        function animate() {
            requestAnimationFrame(animate);

            // 이동 중일 때 무기 좌우 흔들림 (Sway)
            if (controls.isLocked) {
                // 이 예제에서는 단순화를 위해 항상 약간 흔들리게 설정
                walkCycle += 0.05;
                weaponMesh.position.x = 0.5 + Math.sin(walkCycle) * 0.02;
                weaponMesh.position.y = -0.4 + Math.cos(walkCycle * 2) * 0.01;
            }

            renderer.render(scene, camera);
        }

        updateUI();
        animate();
    </script>
</body>
</html>
