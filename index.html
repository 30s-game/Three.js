<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Web FPS - Advanced Combat</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; border: 2px solid lime;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #ui {
            position: absolute; bottom: 30px; right: 50px;
            color: white; font-family: 'Courier New', monospace;
            text-align: right; text-shadow: 2px 2px 2px black;
        }
        #enemy-ui {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            color: red; font-size: 20px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="enemy-ui">로봇 체력: 150 / 150</div>
    <div id="ui">
        <div id="weapon-name">돌격소총</div>
        <div id="ammo-display"><span style="font-size:40px;" id="current-ammo">30</span> / 90</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 초기화 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        document.addEventListener('click', () => controls.lock());

        // --- 조명 ---
        const light = new THREE.PointLight(0xffffff, 50);
        camera.add(light);
        scene.add(camera);
        scene.add(new THREE.AmbientLight(0x404040));

        // --- 바닥 ---
        scene.add(new THREE.Mesh(new THREE.GridHelper(100, 100), new THREE.MeshBasicMaterial({color: 0x444444})));

        // --- 로봇 그룹 생성 (부위별 분리) ---
        const robot = new THREE.Group();
        robot.hp = 150;

        function createPart(w, h, d, y, color, name) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({color}));
            mesh.position.y = y;
            mesh.name = name; // 피격 판정용 이름
            return mesh;
        }

        const head = createPart(0.4, 0.4, 0.4, 2.0, 0xff0000, "HEAD");
        const body = createPart(0.7, 0.8, 0.4, 1.4, 0xaaaaaa, "BODY");
        const legL = createPart(0.25, 0.9, 0.25, 0.5, 0x555555, "LEG");
        legL.position.x = -0.2;
        const legR = createPart(0.25, 0.9, 0.25, 0.5, 0x555555, "LEG");
        legR.position.x = 0.2;

        robot.add(head, body, legL, legR);
        robot.position.set(0, 0, -10);
        scene.add(robot);

        // --- 무기 데이터 ---
        const weapons = {
            "돌격소총": { ammo: 30, max: 30, total: 90, type: 'gun' },
            "쇼티": { ammo: 2, max: 2, total: 12, type: 'shotgun' },
            "단검": { type: 'melee' }
        };
        let currentWp = "돌격소총";
        const raycaster = new THREE.Raycaster();

        // --- 데미지 계산 함수 ---
        function calculateDamage(partName, distance, isRightClick) {
            if (currentWp === "돌격소총") {
                if (partName === "HEAD") return 150;
                if (partName === "BODY") return 60;
                return 30; // LEG
            } 
            if (currentWp === "쇼티") {
                if (distance < 3) return 150;
                if (distance < 8) return 30;
                return 10;
            }
            if (currentWp === "단검") {
                // 백스탭 판정: 내 시선 방향과 로봇의 시선 방향이 비슷하면 뒤에서 찌른 것
                const playerDir = new THREE.Vector3();
                camera.getWorldDirection(playerDir);
                const robotDir = new THREE.Vector3(0, 0, -1); // 로봇은 기본적으로 앞(-z)을 봄
                
                const dot = playerDir.dot(robotDir);
                if (isRightClick && dot > 0.5) return 150; // 뒤에서 우클릭
                return 75;
            }
            return 0;
        }

        // --- 발사 로직 ---
        function attack(isRightClick = false) {
            const wp = weapons[currentWp];
            if (wp.type !== 'melee' && wp.ammo <= 0) return;
            if (wp.type !== 'melee') wp.ammo--;

            // 레이캐스팅 (정중앙 발사)
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(robot.children);

            if (intersects.length > 0) {
                const hit = intersects[0];
                const damage = calculateDamage(hit.object.name, hit.distance, isRightClick);
                robot.hp -= damage;
                console.log(`${hit.object.name} 피격! 데미지: ${damage}`);
                
                if (robot.hp <= 0) {
                    robot.hp = 0;
                    hit.object.material.color.set(0x000000); // 파괴 효과
                }
            }
            updateUI();
        }

        // --- 이벤트 ---
        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) attack(false); // 좌클릭
            if (e.button === 2 && currentWp === "단검") attack(true); // 단검 우클릭
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Digit1') currentWp = "돌격소총";
            if (e.code === 'Digit2') currentWp = "쇼티";
            if (e.code === 'Digit3') currentWp = "단검";
            updateUI();
        });

        function updateUI() {
            const wp = weapons[currentWp];
            document.getElementById('weapon-name').innerText = currentWp;
            document.getElementById('current-ammo').innerText = wp.type === 'melee' ? "-" : wp.ammo;
            document.getElementById('enemy-ui').innerText = `로봇 체력: ${robot.hp} / 150`;
        }

        window.addEventListener('contextmenu', e => e.preventDefault());

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
