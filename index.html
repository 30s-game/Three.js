<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Web FPS - 1vs1 Robot</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 10px; height: 10px; background: red;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #ui {
            position: absolute; bottom: 20px; left: 20px;
            color: white; font-family: sans-serif; font-size: 20px;
            text-shadow: 2px 2px 2px black;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">무기: 돌격소총 (1) | 상태: 정지</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 초기 세팅 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 하늘색
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 조명 ---
        const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 1);
        scene.add(light);

        // --- 바닥 및 로봇(적) 생성 ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({color: 0x555555}));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const robot = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshStandardMaterial({color: 0xff0000}));
        robot.position.set(0, 1, -10);
        scene.add(robot);

        // --- 컨트롤러 설정 ---
        const controls = new PointerLockControls(camera, document.body);
        document.addEventListener('click', () => controls.lock());

        // --- 게임 상태 변수 ---
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isCrouching = false, isRunning = true, isZooming = false;
        let canJump = true;
        let velocity = new THREE.Vector3();
        let currentWeapon = "돌격소총";

        // --- 키 입력 이벤트 ---
        const onKeyDown = (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) velocity.y += 5; canJump = false; break;
                case 'ControlLeft': 
                    isCrouching = true; 
                    camera.position.y = 1.0; // 웅크리기 높이
                    break;
                case 'ShiftLeft': isRunning = false; break; // Shift 누르면 걷기
                case 'Digit1': currentWeapon = "돌격소총"; updateUI(); break;
                case 'Digit2': currentWeapon = "쇼티"; updateUI(); break;
                case 'Digit3': currentWeapon = "단검"; updateUI(); break;
            }
        };

        const onKeyUp = (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
                case 'ControlLeft': 
                    isCrouching = false; 
                    camera.position.y = 1.7; // 기본 키 높이
                    break;
                case 'ShiftLeft': isRunning = true; break;
            }
        };

        // --- 마우스 이벤트 ---
        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) console.log(currentWeapon + " 발사!"); // 좌클릭
            if (e.button === 2) { // 우클릭 줌
                isZooming = true;
                camera.fov = 35;
                camera.updateProjectionMatrix();
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) {
                isZooming = false;
                camera.fov = 75;
                camera.updateProjectionMatrix();
            }
        });

        window.addEventListener('contextmenu', e => e.preventDefault()); // 우클릭 메뉴 방지

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        function updateUI() {
            document.getElementById('ui').innerText = `무기: ${currentWeapon} | 상태: ${isCrouching ? '웅크리기' : (isRunning ? '뛰기' : '걷기')}`;
        }

        // --- 메인 루프 (Update) ---
        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                // 마찰력 계수
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.0 * delta; // 중력

                // 이동 속도 결정
                let moveSpeed = isRunning ? 120.0 : 40.0;
                if (isCrouching) moveSpeed = 20.0;

                const direction = new THREE.Vector3();
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * moveSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * moveSpeed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                camera.position.y += (velocity.y * delta);

                if (camera.position.y < (isCrouching ? 1.0 : 1.7)) {
                    velocity.y = 0;
                    camera.position.y = (isCrouching ? 1.0 : 1.7);
                    canJump = true;
                }
            }

            renderer.render(scene, camera);
            prevTime = time;
        }

        animate();
    </script>
</body>
</html>
